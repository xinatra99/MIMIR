name: Validate public reference

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full Git history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test release-boundary checks
        run: python -m unittest discover -s tests -v
      - name: Audit example vault
        run: python scripts/vault_audit.py examples/vault
      - name: Snapshot example metrics
        run: python scripts/snapshot_metrics.py examples/vault
      - name: Check documentation links
        run: python scripts/check_markdown_links.py .
      - name: Scan public repository boundary
        run: python scripts/public_preflight.py .
