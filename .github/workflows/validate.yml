name: Validate public reference

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan the full Git history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test release-boundary checks
        run: python -m unittest discover -s tests -v
      - name: Audit example vault
        run: python scripts/vault_audit.py examples/vault
      - name: Snapshot example metrics
        run: python scripts/snapshot_metrics.py examples/vault
      - name: Check documentation links
        run: python scripts/check_markdown_links.py .
      - name: Scan public repository boundary
        run: python scripts/public_preflight.py .
